name: Build DouyinDeepSeek

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run release contract tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Prepare Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build rootless and rootful packages
        run: |
          mkdir -p artifact/rootless artifact/rootful artifact/fullsign
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb artifact/rootless/
          rm -f packages/*.deb
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=
          cp packages/*.deb artifact/rootful/
          cp .theos/obj/DouyinDeepSeek.dylib artifact/fullsign/DouyinDeepSeek-AllSign.dylib

      - name: Verify package versions
        run: |
          expected="$(awk '/^Version:/{print $2}' control)"
          test "$(dpkg-deb -f artifact/rootless/*.deb Version)" = "$expected"
          test "$(dpkg-deb -f artifact/rootful/*.deb Version)" = "$expected"

      - name: Upload rootless package
        uses: actions/upload-artifact@v7
        with:
          name: DouyinDeepSeek-rootless
          path: artifact/rootless/*.deb
          if-no-files-found: error

      - name: Upload rootful package
        uses: actions/upload-artifact@v7
        with:
          name: DouyinDeepSeek-rootful
          path: artifact/rootful/*.deb
          if-no-files-found: error

      - name: Upload AllSign dylib
        uses: actions/upload-artifact@v7
        with:
          name: DouyinDeepSeek-AllSign
          path: artifact/fullsign/DouyinDeepSeek-AllSign.dylib
          if-no-files-found: error
